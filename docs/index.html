<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#72c9e8" />
<title>Flappy Mini</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  body{display:grid;place-items:center}
  #wrap{position:relative;width:min(100vw,480px);height:100dvh;max-height:820px;background:#72c9e8;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #ui{position:absolute;inset:0;pointer-events:none;color:#fff;text-align:center;text-shadow:0 2px 0 #333,0 0 4px #333}
  #score{font-size:48px;font-weight:900;margin-top:24px}
  #panel{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:86%;padding:20px;border-radius:18px;background:rgba(0,0,0,.48);backdrop-filter:blur(4px)}
  #panel h1{margin:0 0 8px;font-size:34px} #panel p{margin:7px 0;font-size:17px;line-height:1.35}
  #panel .small{font-size:14px;opacity:.9}
  .hidden{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="panel">
      <h1 id="title">Flappy Mini</h1>
      <p id="message">Tap anywhere to start and flap.</p>
      <p id="best">Best: 0</p>
      <p class="small">Phone: tap • Computer: click or Space</p>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const wrap = document.getElementById('wrap');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const panel = document.getElementById('panel');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const bestEl = document.getElementById('best');

  let W=360,H=640,dpr=1, state='ready', score=0, best=Number(localStorage.getItem('flappyMiniBest')||0), last=0, spawnTimer=0;
  const bird={x:92,y:260,r:16,vy:0,rot:0};
  let pipes=[];
  const gravity=1250, flap=-390, pipeSpeed=145, pipeWidth=64, gap=165, spawnEvery=1.55;

  function resize(){
    const r=wrap.getBoundingClientRect(); W=r.width; H=r.height; dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    bird.x=Math.max(72,W*.25);
    if(state==='ready') bird.y=H*.42;
  }
  addEventListener('resize',resize); resize();

  function reset(){
    state='ready'; score=0; pipes=[]; spawnTimer=0; bird.y=H*.42; bird.vy=0; bird.rot=0;
    scoreEl.textContent='0'; title.textContent='Flappy Mini'; message.textContent='Tap anywhere to start and flap.';
    bestEl.textContent='Best: '+best; panel.classList.remove('hidden');
  }
  function start(){ state='playing'; panel.classList.add('hidden'); bird.vy=flap; }
  function die(){
    if(state!=='playing') return; state='dead';
    if(score>best){best=score; localStorage.setItem('flappyMiniBest',best)}
    title.textContent='Game Over'; message.textContent='Score: '+score+' — tap to try again.'; bestEl.textContent='Best: '+best;
    setTimeout(()=>panel.classList.remove('hidden'),250);
  }
  function action(e){
    if(e) e.preventDefault();
    if(state==='ready') start();
    else if(state==='playing') bird.vy=flap;
    else if(state==='dead'){ reset(); start(); }
  }
  wrap.addEventListener('pointerdown',action,{passive:false});
  addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();action();} });

  function addPipe(){
    const margin=85, ground=48;
    const minCenter=margin+gap/2, maxCenter=H-ground-margin-gap/2;
    const center=minCenter+Math.random()*Math.max(20,maxCenter-minCenter);
    pipes.push({x:W+20,top:center-gap/2,bottom:center+gap/2,passed:false});
  }
  function collide(p){
    const bx=bird.x, by=bird.y, r=bird.r-3;
    const withinX=bx+r>p.x && bx-r<p.x+pipeWidth;
    return withinX && (by-r<p.top || by+r>p.bottom);
  }
  function update(dt){
    if(state!=='playing') return;
    bird.vy+=gravity*dt; bird.y+=bird.vy*dt; bird.rot=Math.max(-.45,Math.min(1.15,bird.vy/520));
    spawnTimer+=dt; if(spawnTimer>=spawnEvery){spawnTimer-=spawnEvery;addPipe();}
    for(const p of pipes){
      p.x-=pipeSpeed*dt;
      if(!p.passed && p.x+pipeWidth<bird.x){p.passed=true;score++;scoreEl.textContent=score;}
      if(collide(p)) die();
    }
    pipes=pipes.filter(p=>p.x+pipeWidth>-10);
    if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0}
    if(bird.y+bird.r>H-48) die();
  }

  function drawBackground(t){
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#70d6f2'); sky.addColorStop(1,'#d9f4ff'); ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<4;i++){ const x=((i*150 - (t*.012)%600)+650)%650-80, y=80+i*75; ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.arc(x+25,y+5,18,0,Math.PI*2);ctx.arc(x-24,y+7,16,0,Math.PI*2);ctx.fill(); }
    ctx.fillStyle='#8ed35f'; ctx.fillRect(0,H-48,W,48); ctx.fillStyle='#6eb348';ctx.fillRect(0,H-48,W,8);
  }
  function drawPipe(p){
    ctx.fillStyle='#58b83f';ctx.strokeStyle='#2d7528';ctx.lineWidth=3;
    ctx.fillRect(p.x,0,pipeWidth,p.top);ctx.strokeRect(p.x,0,pipeWidth,p.top);
    ctx.fillRect(p.x,p.bottom,pipeWidth,H-48-p.bottom);ctx.strokeRect(p.x,p.bottom,pipeWidth,H-48-p.bottom);
    ctx.fillStyle='#70d653';
    ctx.fillRect(p.x-5,p.top-24,pipeWidth+10,24);ctx.strokeRect(p.x-5,p.top-24,pipeWidth+10,24);
    ctx.fillRect(p.x-5,p.bottom,pipeWidth+10,24);ctx.strokeRect(p.x-5,p.bottom,pipeWidth+10,24);
  }
  function drawBird(t){
    const bob=state==='ready'?Math.sin(t/180)*5:0;
    ctx.save();ctx.translate(bird.x,bird.y+bob);ctx.rotate(state==='ready'?-.15:bird.rot);
    ctx.fillStyle='#ffd93d';ctx.strokeStyle='#8b6417';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,19,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(15,-2);ctx.lineTo(31,3);ctx.lineTo(15,7);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-7,6,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(9,-7,2.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f2b632';ctx.beginPath();ctx.ellipse(-8,4,11,6,state==='playing'?Math.sin(t/45)*.35:.3,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
  function render(t){ drawBackground(t); for(const p of pipes) drawPipe(p); drawBird(t); }
  function loop(t){ const dt=Math.min((t-last)/1000||0,.033); last=t; update(dt); render(t); requestAnimationFrame(loop); }
  bestEl.textContent='Best: '+best; requestAnimationFrame(loop);
})();
</script>
</body>
</html>
